name: Build And Deploy

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      deploy:
        description: Deploy the built artifact to production
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: ai-full-stack-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Build site
        run: yarn build

      - name: Package built site
        if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.deploy)
        run: tar -czf site.tar.gz -C .vitepress/dist .

      - name: Upload built site
        if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.deploy)
        uses: actions/upload-artifact@v4
        with:
          name: ai-full-stack-site-${{ github.sha }}
          path: site.tar.gz
          if-no-files-found: error
          retention-days: 7

  deploy:
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.deploy)
    needs: build
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout deployment configuration
        uses: actions/checkout@v4

      - name: Download built site
        uses: actions/download-artifact@v4
        with:
          name: ai-full-stack-site-${{ github.sha }}

      - name: Extract site
        run: mkdir site && tar -xzf site.tar.gz -C site

      - name: Deploy built artifact
        uses: easingthemes/ssh-deploy@v5.1.1
        with:
          SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY || secrets.PRIVATE_KEY }}
          REMOTE_HOST: ${{ secrets.DEPLOY_HOST || '129.211.13.9' }}
          REMOTE_USER: ${{ secrets.DEPLOY_USER || 'root' }}
          TARGET: ${{ secrets.DEPLOY_PATH || '/www/wwwroot/blog.junfeng530.xyz/' }}
          SOURCE: site/
          ARGS: -rlgoDzvc --delete

      - name: Install VitePress clean URL handling
        uses: easingthemes/ssh-deploy@v5.1.1
        with:
          SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY || secrets.PRIVATE_KEY }}
          REMOTE_HOST: ${{ secrets.DEPLOY_HOST || '129.211.13.9' }}
          REMOTE_USER: ${{ secrets.DEPLOY_USER || 'root' }}
          TARGET: /tmp/jiang-blog-nginx-${{ github.sha }}/
          SOURCE: deploy/
          ARGS: -rlgoDzvc
          SCRIPT_AFTER_REQUIRED: true
          SCRIPT_AFTER: |
            set -eu
            staged_dir="/tmp/jiang-blog-nginx-${{ github.sha }}"
            nginx_config="${{ secrets.DEPLOY_NGINX_CONFIG_PATH || '/www/server/nginx/conf/nginx.conf' }}"
            trap 'rm -rf "$staged_dir"' EXIT

            bash "$staged_dir/install-nginx-clean-urls.sh" \
              "$nginx_config" \
              "/docs/ai-agent/agent-lifecycle"
