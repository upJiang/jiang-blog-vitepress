name: Verify And Deploy

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      deploy:
        description: Deploy the verified artifact to production
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: ai-full-stack-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Verify content, privacy, types and build
        run: yarn verify

      - name: Package verified site
        if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.deploy)
        run: tar -czf site.tar.gz -C .vitepress/dist .

      - name: Upload verified site
        if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.deploy)
        uses: actions/upload-artifact@v4
        with:
          name: ai-full-stack-site-${{ github.sha }}
          path: site.tar.gz
          if-no-files-found: error
          retention-days: 7

  deploy:
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.deploy)
    needs: verify
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Download verified site
        uses: actions/download-artifact@v4
        with:
          name: ai-full-stack-site-${{ github.sha }}

      - name: Extract site
        run: mkdir site && tar -xzf site.tar.gz -C site

      - name: Deploy verified artifact
        uses: easingthemes/ssh-deploy@v5.1.1
        with:
          SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
          REMOTE_HOST: ${{ secrets.DEPLOY_HOST }}
          REMOTE_USER: ${{ secrets.DEPLOY_USER }}
          TARGET: ${{ secrets.DEPLOY_PATH }}
          SOURCE: site/
          ARGS: -rlgoDzvc --delete
